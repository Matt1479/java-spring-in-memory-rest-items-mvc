<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{fragments/head :: head}">
        <title>Item</title>
    </head>

    <body>

        <header th:replace="~{fragments/header :: header}"></header>

        <div th:replace="~{fragments/flash-messages :: flash-messages}"></div>

        <main class="container py-5 text-center">

            <div th:if="${item != null}" class="card">
                <div class="card-body">
                    <h1 th:text="${item.name}" class="card-title"></h1>
                    <p th:text="${item.description}" class="card-text"></p>
                    <p class="card-text">Price: <span th:text="${item.price}"></span></p>
                </div>
            </div>

        </main>

        <script th:replace="~{fragments/bootstrap-scripts :: scripts}"></script>

    </body>

</html>
