<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Items</title>
    </head>

    <body>

        <header th:replace="~{fragments/header :: header}"></header>

        <main>

            <div th:if="${items != null and !items.isEmpty()}">
                <h1>Items</h1>

                <!-- `th:each` means: repeat this element, including all of its contents,
                    once for each item -->
                <div th:each="item : ${items}">
                    <h2 th:text="${'#' + item.id + ' - ' + item.name}"></h2>
                    <a th:href="@{/items/{id}(id=${item.id})}">View item</a>
                    <a th:href="@{/items/{id}/edit(id=${item.id})}">Edit item</a>
                    <div>
                        <form th:action="@{/items/{id}/delete(id=${item.id})}" method="post">
                            <!-- Spring's hidden method support -->
                            <input name="_method" type="hidden" value="delete">
                            <button type="submit">Delete item</button>
                        </form>
                    </div>
                </div>
            </div>

            <div th:if="${items == null or items.isEmpty()}">
                <h1>No items</h1>
            </div>

        </main>

    </body>

</html>
