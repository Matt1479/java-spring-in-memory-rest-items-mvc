<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{fragments/head :: head}">
        <title>Items</title>
    </head>

    <body>

        <header th:replace="~{fragments/header :: header}"></header>

        <div th:replace="~{fragments/flash-messages :: flash-messages}"></div>

        <main class="container py-5 text-center">

            <div th:if="${items != null and !items.isEmpty()}">
                <h1>Items</h1>

                <!-- `th:each` means: repeat this element, including all of its contents,
                    once for each item -->
                <div th:each="item : ${items}" class="card mb-3">
                    <div class="card-body">
                        <h2 th:text="${'#' + item.id + ' - ' + item.name}" class="card-title"></h2>
                        <p class="card-text">
                            <a th:href="@{/items/{id}(id=${item.id})}">View item</a>
                        </p>
                        <p class="card-text">
                            <a th:href="@{/items/{id}/edit(id=${item.id})}">Edit item</a>
                        </p>
                        <div>
                            <form th:action="@{/items/{id}/delete(id=${item.id})}" method="post">
                                <!-- Spring's hidden method support -->
                                <input name="_method" type="hidden" value="delete">
                                <button class="btn btn-danger btn-lg" type="submit">Delete item</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <div th:if="${items == null or items.isEmpty()}">
                <h1>No items</h1>
            </div>

        </main>

        <script th:replace="~{fragments/bootstrap-scripts :: scripts}"></script>

    </body>

</html>
