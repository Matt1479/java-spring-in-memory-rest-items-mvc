<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

    <head th:replace="~{fragments/head :: head}">
        <title>Edit an item</title>
    </head>

    <body>

        <header th:replace="~{fragments/header :: header}"></header>

        <div th:replace="~{fragments/flash-messages :: flash-messages}"></div>

        <main class="container py-5 text-center">

            <h1>Edit an item</h1>

            <form th:action="@{/items/{id}/edit(id=${item.id})}" method="post">
                <div class="mb-3">
                    <label for="description">Description</label>
                    <input th:value="${item.description}" class="form-control" id="description" name="description" type="text">
                </div>

                <div class="mb-3">
                    <label for="name">Name</label>
                    <input th:value="${item.name}" class="form-control" id="name" name="name" type="text">
                </div>

                <div class="mb-3">
                    <label for="price">Price</label>
                    <input th:value="${item.price}" class="form-control" id="price" name="price" step="0.01" type="number">
                </div>

                <button class="btn btn-success btn-lg" type="submit">Edit item</button>
            </form>

        </main>

        <script th:replace="~{fragments/bootstrap-scripts :: scripts}"></script>

    </body>

</html>
