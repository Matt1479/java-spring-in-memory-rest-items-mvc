<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Edit an item</title>
    </head>

    <body>

        <header th:replace="~{fragments/header :: header}"></header>

        <div th:replace="~{fragments/flash-messages :: flash-messages}"></div>

        <main>

            <h1>Edit an item</h1>

            <form th:action="@{/items/{id}/edit(id=${item.id})}" method="post">
                <div>
                    <label for="description">Description</label>
                    <input th:value="${item.description}" id="description" name="description" type="text">
                </div>

                <div>
                    <label for="name">Name</label>
                    <input th:value="${item.name}" id="name" name="name" type="text">
                </div>

                <div>
                    <label for="price">Price</label>
                    <input th:value="${item.price}" id="price" name="price" step="0.01" type="number">
                </div>

                <button type="submit">Edit item</button>
            </form>

        </main>

    </body>

</html>
